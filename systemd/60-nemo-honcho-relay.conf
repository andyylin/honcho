# Additional key-only relay listener for Nemo Honcho over Tailscale device sharing.
# Port 22 remains the normal SSH endpoint; port 2222 bypasses Tailscale SSH
# interception so Nemo's isolated userspace client can make a standard
# key-authenticated local forward through rpi5.
Port 22
Port 2222

Match LocalPort 2222
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
